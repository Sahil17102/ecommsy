name: searchcraft-services

services:
  backend:
    image: searchcraft-services-backend
    container_name: searchcraft-services-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    env_file:
      - .env
    restart: always

    networks:
      - default
      - internal

networks:
  internal:
    external: true